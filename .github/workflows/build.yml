# Test on every push, and on a tag (v1.2.3) build every OS and publish a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
          go test ./...
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then sh build.sh "${GITHUB_REF_NAME#v}"; else sh build.sh; fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum espkvm-agent-* > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "espkvm-agent ${GITHUB_REF_NAME#v}" \
            --notes "Install: https://espkvm.io/agent/"
